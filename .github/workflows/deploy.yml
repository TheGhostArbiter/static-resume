name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: pip install --quiet "websockets>=10,<13"

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Run UI test suite (headless Chrome via CDP)
        run: python3 tests/test_home.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow for OG generation
        run: pip install --quiet Pillow

      - name: Generate per-case OG images and stub pages
        run: python3 scripts/gen_cases.py

      - name: Create Pages project if it doesn't exist
        run: npx wrangler pages project create static-resume --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          npx wrangler pages deploy . \
            --project-name=static-resume \
            --commit-dirty=true \
            --branch="${BRANCH_NAME}" \
            2>&1 | tee deploy.log
          # wrangler prints one or more https://*.pages.dev URLs; grab the last hash URL.
          URL=$(grep -Eo 'https://[a-z0-9-]+\.static-resume(-[a-z0-9]+)?\.pages\.dev' deploy.log | tail -1)
          if [ -z "$URL" ]; then
            URL=$(grep -Eo 'https://[a-z0-9-]+\.pages\.dev' deploy.log | tail -1)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice title=Cloudflare Pages preview::$URL"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER="<!-- bsc-cf-preview -->"
          SHORT_SHA="${SHA:0:7}"
          BODY=$(cat <<EOF
          $MARKER
          🚀 **Cloudflare Pages preview:** $URL

          - Commit: \`$SHORT_SHA\`
          - Build: [view run]($RUN_URL)

          <sub>This comment updates automatically on each push to the PR.</sub>
          EOF
          )

          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)

          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING" \
              --method PATCH \
              --field body="$BODY"
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
              --method POST \
              --field body="$BODY"
          fi
